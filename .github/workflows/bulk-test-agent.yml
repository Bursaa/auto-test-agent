name: Bulk test agent

# Manual coverage-improvement run: the whole application (or one area) is treated
# as "changed", the single test-generation agent adds or updates tests, the tests are
# verified in token-free jobs, and the result is opened as a pull request.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Part of the application the agent may cover
        type: choice
        options: [all, backend, frontend]
        default: all

permissions: {}

concurrency:
  group: bulk-test-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      backend_coverage: ${{ steps.backend-tests.outputs.coverage }}
      frontend_coverage: ${{ steps.frontend-tests.outputs.coverage }}
      passed: ${{ steps.backend-tests.outcome == 'success' && steps.frontend-tests.outcome == 'success' }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci --prefix frontend

      - name: Run backend baseline tests
        id: backend-tests
        continue-on-error: true
        working-directory: backend
        run: |
          set +e
          python -m pytest --cov=app --cov-report=json:"$RUNNER_TEMP/backend-base-coverage.json" --cov-report=term-missing
          result=$?
          coverage=$(jq -r '.totals.percent_covered // empty' "$RUNNER_TEMP/backend-base-coverage.json" 2>/dev/null || true)
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Run frontend baseline tests
        id: frontend-tests
        continue-on-error: true
        working-directory: frontend
        run: |
          set +e
          npm run test:coverage
          result=$?
          coverage=$(jq -r '.total.statements.pct // empty' coverage/coverage-summary.json 2>/dev/null || true)
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
          exit "$result"

  generate:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      has_code: ${{ steps.prepare.outputs.has_code }}
      has_tests: ${{ steps.accept-plan.outputs.has_tests || 'false' }}
      decision: ${{ steps.accept-plan.outputs.decision || 'skip' }}
    steps:
      - name: Check out trusted workflow tools and customizations
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out application source for read/edit only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: src
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for Copilot CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Initialize workflow state and list application files
        id: prepare
        working-directory: trusted
        env:
          SCOPE: ${{ inputs.scope }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/agent/orchestrator.py prepare \
            --all-files \
            --scope "$SCOPE" \
            --repo-dir "$GITHUB_WORKSPACE/src" \
            --head-sha "$HEAD_SHA" \
            --state-file "$RUNNER_TEMP/state.json" \
            --changed-files-file "$RUNNER_TEMP/changed-files.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prepare isolated trusted agent workspace
        if: steps.prepare.outputs.has_code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/copilot-workspace/.github"
          cp -R trusted/.github/agents trusted/.github/skills "$RUNNER_TEMP/copilot-workspace/.github/"

      - name: Install GitHub Copilot CLI
        if: steps.prepare.outputs.has_code == 'true'
        run: npm install --global @github/copilot

      - name: Create the generation prompt
        if: steps.prepare.outputs.has_code == 'true'
        working-directory: trusted
        run: |
          python scripts/agent/orchestrator.py prompt \
            --mode generate \
            --bulk \
            --state-file "$RUNNER_TEMP/state.json" \
            --repo-dir "$GITHUB_WORKSPACE/src" \
            --output "$RUNNER_TEMP/prompt.md"

      - name: Invoke the single test-generation agent
        if: steps.prepare.outputs.has_code == 'true'
        working-directory: ${{ runner.temp }}/copilot-workspace
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot \
            --agent=test-generation \
            --add-dir="$GITHUB_WORKSPACE/src" \
            --available-tools='read,search,edit' \
            --output-format=json \
            -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            > "$RUNNER_TEMP/copilot-output.jsonl"

      - name: Parse and validate the structured agent plan
        if: steps.prepare.outputs.has_code == 'true'
        working-directory: trusted
        run: |
          python scripts/agent/orchestrator.py parse-plan \
            --jsonl-file "$RUNNER_TEMP/copilot-output.jsonl" \
            --plan-file "$RUNNER_TEMP/plan.json"

      - name: Accept plan and advance the state machine
        id: accept-plan
        if: steps.prepare.outputs.has_code == 'true'
        working-directory: trusted
        run: |
          python scripts/agent/orchestrator.py accept-plan \
            --state-file "$RUNNER_TEMP/state.json" \
            --plan-file "$RUNNER_TEMP/plan.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Package only allowlisted test files
        id: package
        if: steps.accept-plan.outcome == 'success'
        working-directory: trusted
        run: |
          python scripts/agent/orchestrator.py package \
            --state-file "$RUNNER_TEMP/state.json" \
            --repo-dir "$GITHUB_WORKSPACE/src" \
            --bundle-file "$RUNNER_TEMP/bundle.json"

      - name: Upload validated generation artifact
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bulk-generated-tests
          path: |
            ${{ runner.temp }}/bundle.json
            ${{ runner.temp }}/state.json
          if-no-files-found: error
          retention-days: 3

  verify-backend:
    needs: generate
    if: needs.generate.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.backend-tests.outcome == 'success' }}
      coverage: ${{ steps.backend-tests.outputs.coverage }}
    steps:
      - name: Check out trusted orchestration tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out application source for unprivileged test execution
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: src
          persist-credentials: false

      - name: Download generated tests
        uses: actions/download-artifact@v4
        with:
          name: bulk-generated-tests
          path: ${{ runner.temp }}/generated

      - name: Apply validated test bundle
        working-directory: trusted
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/agent/orchestrator.py apply \
            --bundle-file "$RUNNER_TEMP/generated/bundle.json" \
            --repo-dir "$GITHUB_WORKSPACE/src" \
            --head-sha "$HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        working-directory: src
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests with generated tests
        id: backend-tests
        continue-on-error: true
        working-directory: src/backend
        run: |
          set +e
          python -m pytest --cov=app --cov-report=json:"$RUNNER_TEMP/backend-pr-coverage.json" --cov-report=term-missing
          result=$?
          coverage=$(jq -r '.totals.percent_covered // empty' "$RUNNER_TEMP/backend-pr-coverage.json" 2>/dev/null || true)
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
          exit "$result"

  verify-frontend:
    needs: generate
    if: needs.generate.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.frontend-tests.outcome == 'success' }}
      coverage: ${{ steps.frontend-tests.outputs.coverage }}
    steps:
      - name: Check out trusted orchestration tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out application source for unprivileged test execution
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: src
          persist-credentials: false

      - name: Download generated tests
        uses: actions/download-artifact@v4
        with:
          name: bulk-generated-tests
          path: ${{ runner.temp }}/generated

      - name: Apply validated test bundle
        working-directory: trusted
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/agent/orchestrator.py apply \
            --bundle-file "$RUNNER_TEMP/generated/bundle.json" \
            --repo-dir "$GITHUB_WORKSPACE/src" \
            --head-sha "$HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend test dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run frontend tests with generated tests
        id: frontend-tests
        continue-on-error: true
        working-directory: src/frontend
        run: |
          set +e
          npm run test:coverage
          result=$?
          coverage=$(jq -r '.total.statements.pct // empty' coverage/coverage-summary.json 2>/dev/null || true)
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
          exit "$result"

  publish:
    needs: [baseline, generate, verify-backend, verify-frontend]
    if: always() && github.ref_type == 'branch' && needs.generate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Decide whether the verified tests can be published
        id: gate
        env:
          BASELINE: ${{ needs.baseline.outputs.passed }}
          HAS_TESTS: ${{ needs.generate.outputs.has_tests }}
          BACKEND: ${{ needs.verify-backend.outputs.passed }}
          FRONTEND: ${{ needs.verify-frontend.outputs.passed }}
        run: |
          if [ "$BASELINE" = "true" ] && [ "$HAS_TESTS" = "true" ] && [ "$BACKEND" = "true" ] && [ "$FRONTEND" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out trusted publication tools
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the selected branch for the test-only commit
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: src
          persist-credentials: true

      - name: Download generation result
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bulk-generated-tests
          path: ${{ runner.temp }}/generated

      - name: Finalize state, apply and stage the verified test bundle
        if: steps.gate.outputs.publish == 'true'
        working-directory: trusted
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/agent/orchestrator.py record-verification \
            --state-file "$RUNNER_TEMP/generated/state.json" \
            --result passed
          python scripts/agent/orchestrator.py apply \
            --bundle-file "$RUNNER_TEMP/generated/bundle.json" \
            --repo-dir "$GITHUB_WORKSPACE/src" \
            --head-sha "$HEAD_SHA"
          python scripts/agent/orchestrator.py stage-bundle \
            --bundle-file "$RUNNER_TEMP/generated/bundle.json" \
            --repo-dir "$GITHUB_WORKSPACE/src" \
            --head-sha "$HEAD_SHA"

      - name: Commit and push the tests to a new branch
        id: commit
        if: steps.gate.outputs.publish == 'true'
        env:
          TEST_BRANCH: agent/coverage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if git -C src diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No test-file changes to commit."
            exit 0
          fi
          git -C src config user.name "github-actions[bot]"
          git -C src config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C src commit -m "[test-agent] Add verified unit tests"
          git -C src push origin "HEAD:refs/heads/${TEST_BRANCH}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "branch=${TEST_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Publish results and open the pull request
        if: always()
        uses: actions/github-script@v7
        env:
          BASE_BRANCH: ${{ github.ref_name }}
          TEST_BRANCH: ${{ steps.commit.outputs.branch }}
          COMMIT_CREATED: ${{ steps.commit.outputs.created }}
          SCOPE: ${{ inputs.scope }}
          DECISION: ${{ needs.generate.outputs.decision }}
          BASELINE: ${{ needs.baseline.outputs.passed }}
          BACKEND: ${{ needs.verify-backend.outputs.passed }}
          FRONTEND: ${{ needs.verify-frontend.outputs.passed }}
          BASELINE_BACKEND_COVERAGE: ${{ needs.baseline.outputs.backend_coverage }}
          BASELINE_FRONTEND_COVERAGE: ${{ needs.baseline.outputs.frontend_coverage }}
          BACKEND_COVERAGE: ${{ needs.verify-backend.outputs.coverage }}
          FRONTEND_COVERAGE: ${{ needs.verify-frontend.outputs.coverage }}
          BUNDLE_DIR: ${{ runner.temp }}/generated
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const clean = (value, max = 1000) => String(value || '')
              .replace(/@/g, '@\u200b')
              .replace(/[<>`]/g, '')
              .replace(/\r?\n/g, ' ')
              .replace(/\|/g, '\\|')
              .slice(0, max);
            let summary = 'No validated agent plan is available.';
            let fileDecisions = [];
            let targets = [];
            let skills = [];
            let uncertainties = [];
            const bundlePath = `${process.env.BUNDLE_DIR}/bundle.json`;
            if (fs.existsSync(bundlePath)) {
              try {
                const bundle = JSON.parse(fs.readFileSync(bundlePath, 'utf8'));
                summary = clean(bundle.plan?.summary || summary);
                fileDecisions = (bundle.plan?.file_decisions || []).map(item =>
                  `- \`${clean(item.implementation_file, 180)}\`: **${clean(item.decision, 40)}** — ${clean(item.reason, 300)}`
                );
                targets = (bundle.plan?.targets || []).map(target =>
                  `- \`${clean(target.implementation_file, 180)}\` → \`${clean(target.test_file, 180)}\`: ${clean(target.reason, 300)}`
                );
                skills = (bundle.plan?.skills_used || []).map(skill => clean(skill, 80));
                uncertainties = (bundle.plan?.uncertainties || []).map(item => `- ${clean(item, 300)}`);
              } catch (error) {
                core.warning(`Unable to read agent report artifact: ${error.message}`);
              }
            }
            const row = (area, base, after) => {
              const b = Number(base);
              const a = Number(after);
              const valid = base !== '' && after !== '' && Number.isFinite(b) && Number.isFinite(a);
              const delta = valid ? `${a - b > 0 ? '+' : ''}${(a - b).toFixed(2)} pp` : 'unavailable';
              return `| ${area} | ${valid ? `${b}%` : 'unavailable'} | ${valid ? `${a}%` : 'unavailable'} | ${delta} |`;
            };
            const body = [
              '## Bulk test agent results',
              '',
              `Scope: **${clean(process.env.SCOPE, 20)}** · Agent decision: **${clean(process.env.DECISION, 40)}**`,
              '',
              '| Check | Result |',
              '|---|---|',
              `| Baseline tests | ${process.env.BASELINE === 'true' ? 'passed' : clean(process.env.BASELINE || 'not run')} |`,
              `| Backend tests with generated tests | ${clean(process.env.BACKEND || 'not run')} |`,
              `| Frontend tests with generated tests | ${clean(process.env.FRONTEND || 'not run')} |`,
              '',
              '### Statement-coverage delta',
              '',
              '| Area | Before | After | Delta |',
              '|---|---:|---:|---:|',
              row('backend', process.env.BASELINE_BACKEND_COVERAGE, process.env.BACKEND_COVERAGE),
              row('frontend', process.env.BASELINE_FRONTEND_COVERAGE, process.env.FRONTEND_COVERAGE),
              '',
              '### Agent summary',
              '',
              summary,
              ...(fileDecisions.length ? ['', '### Per-file decisions', ...fileDecisions] : []),
              ...(targets.length ? ['', '### Test targets', ...targets] : []),
              ...(skills.length ? ['', `**Reusable skills:** ${skills.join(', ')}`] : []),
              ...(uncertainties.length ? ['', '### Uncertainties', ...uncertainties] : []),
              '',
              `[View workflow logs](${process.env.RUN_URL})`
            ].join('\n');
            await core.summary.addRaw(body).write();
            if (process.env.COMMIT_CREATED !== 'true') {
              core.notice('No tests were published; see the job summary for the reason.');
              return;
            }
            const { owner, repo } = context.repo;
            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              title: `[test-agent] Add verified unit tests (${clean(process.env.SCOPE, 20)})`,
              head: process.env.TEST_BRANCH,
              base: process.env.BASE_BRANCH,
              body
            });
            core.info(`Opened pull request ${pull.html_url}`);
